name: NortonLifeLock
description: 'NortonLifeLock was a consumer cyber-safety company built from the Norton
  antivirus / consumer security business and the LifeLock identity-theft-protection
  brand, offering device security, VPN, password management, dark-web monitoring,
  and identity restoration to individuals and families. It was formed in 2019 when
  Symantec sold its enterprise-security business to Broadcom and renamed the remaining
  consumer unit NortonLifeLock, and in September 2022 it merged with Avast to form
  Gen Digital (NASDAQ: GEN), the current parent of Norton, LifeLock, Avast, AVG,
  Avira, and CCleaner. The company sells consumer subscription products rather than
  a public developer platform: nortonlifelock.com now redirects to gendigital.com,
  and there is no first-party public REST/OAuth developer API, SDK, or developer
  portal. This profile was surfaced as a portfolio lead and enriched to record that
  no public API surface exists.'
